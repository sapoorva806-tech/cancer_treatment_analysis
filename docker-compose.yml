version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hodgkin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hodgkin_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: hodgkin_db
    ports:
      - "5432:5432"
    volumes:
      - hodgkin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hodgkin_user -d hodgkin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: hodgkin_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hodgkin_user:changeme@db:5432/hodgkin_db
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:5500
      API_PREFIX: /api
      MODEL_PATH: ml/models/hodgkin_model.pth
      MODEL_VERSION: "1.0.0"
      ML_MODELS_DIR_OVERRIDE: /ml_models
    volumes:
      - ./ml/models:/ml_models
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: hodgkin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5500:80"

volumes:
  hodgkin_pgdata: