
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Hodgkin Risk Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

<div class="max-w-md w-full bg-white rounded-2xl shadow-md p-8 border border-slate-200">

    <h1 class="text-2xl font-semibold text-slate-800 mb-1">
        Welcome back
    </h1>

    <p class="text-slate-500 text-sm mb-6">
        Log in to view your assessments and risk history.
    </p>

    <form id="loginForm" class="space-y-4">

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Password
            </label>

            <div class="relative">
                <input
                    type="password"
                    id="password"
                    required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400"
                >
                    <span id="eyeIcon">Show</span>
                </button>
            </div>
        </div>

        <div
            id="errorBox"
            class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"
        ></div>

        <button
            type="submit"
            id="submitBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition"
        >
            Log in
        </button>

    </form>

    <p class="text-sm text-slate-500 mt-4 text-center">
        <a href="phone-login.html" class="text-indigo-600 font-medium">
            Log in with phone instead →
        </a>
    </p>

    <p class="text-sm text-slate-500 mt-2 text-center">
        Don't have an account?
        <a href="register.html" class="text-indigo-600 font-medium">
            Register
        </a>
    </p>

</div>

<script src="../js/api.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePassword");

    toggleBtn.addEventListener("click", function () {
        const hidden = passwordInput.type === "password";

        passwordInput.type = hidden ? "text" : "password";
        document.getElementById("eyeIcon").textContent =
            hidden ? "Hide" : "Show";
    });

    form.addEventListener("submit", async function (e) {

        e.preventDefault();

        errorBox.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        try {

            if (typeof window.loginUser !== "function") {
                throw new Error(
                    "Authentication script failed to load. Check api.js path."
                );
            }

            await window.loginUser(email, password);

            window.location.href = "dashboard.html";

        } catch (err) {

            errorBox.textContent = err.message;
            errorBox.classList.remove("hidden");

            submitBtn.disabled = false;
            submitBtn.textContent = "Log in";
        }
    });

});
</script>

</body>
</html>
